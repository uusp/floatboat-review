<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>傅珩｜Floatboat AI 产品运营复盘与实测诊断</title>
<meta name="description" content="围绕获客、激活与留存展开的 AI 产品运营拆解：LiblibAI 模块承接复盘、Floatboat 实测诊断、五道关运营动作与内容样稿。">
<meta property="og:type" content="website">
<meta property="og:title" content="傅珩｜Floatboat AI 产品运营复盘与实测诊断">
<meta property="og:description" content="一份围绕激活与留存的 AI 产品运营拆解，含六人首测、五道关动作与四样内容样稿。">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --ink:#f1eee7;
    --ink-2:#e8e4da;
    --paper:#151616;
    --paper-dim:#4b4a45;
    --muted:#7b7873;
    --line:rgba(21,22,22,.14);
    --line-strong:rgba(21,22,22,.26);
    --lime:#1457fe;
    --coral:#e7402b;
    --aqua:#a87f2c;
    --blue:#1457fe;
    --rail-w:236px;
    --top-h:72px;
    --dock-h:68px;
    --progress:12.5%;
    --sans:"MiSans","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",sans-serif;
    --mono:"Cascadia Mono","SFMono-Regular","Consolas","Liberation Mono",monospace;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  html{background:var(--ink)}
  body{
    margin:0;
    overflow:hidden;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button{font:inherit;color:inherit}
  button:focus-visible,.quote-toggle:focus-visible,a:focus-visible{
    outline:2px solid var(--lime);
    outline-offset:3px;
  }
  ::selection{background:rgba(20,87,254,.24);color:var(--paper)}

  .backdrop{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
    radial-gradient(1200px 780px at 82% -6%,rgba(168,127,44,.13),transparent 58%),
    radial-gradient(900px 620px at 4% 108%,rgba(231,64,43,.09),transparent 60%),
    linear-gradient(150deg,#f3f0e8 0%,#ece8de 48%,#f5f2ea 100%);
  }
  .backdrop::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(21,22,22,.16) 1px,transparent 1px);
    background-size:28px 28px;opacity:.22;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.82),transparent 72%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,.82),transparent 72%);
  }
  .backdrop::after{
    content:"";position:absolute;width:120vmax;height:120vmax;right:-40vmax;top:-50vmax;
    background:repeating-radial-gradient(circle at center,transparent 0 74px,rgba(168,127,44,.075) 75px 76px,transparent 77px 118px);
    transform:rotate(-14deg);opacity:.72;
  }
  .backdrop .horizon{
    position:absolute;left:-5%;right:-5%;top:67%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(231,64,43,.22) 22%,rgba(231,64,43,.06) 58%,transparent);
    transform:rotate(-3.5deg);
  }
  .backdrop .beam{
    position:absolute;right:12%;top:8%;width:1px;height:54%;
    background:linear-gradient(180deg,transparent,rgba(20,87,254,.16),transparent);
    transform:rotate(22deg);transform-origin:top;
  }

  .app{
    position:relative;z-index:1;height:100dvh;
    display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:var(--top-h) minmax(0,1fr);
  }

  .topbar{
    grid-column:1/-1;position:relative;z-index:6;display:flex;align-items:center;gap:18px;
    padding:0 22px;border-bottom:1px solid var(--line);
    background:rgba(241,238,231,.76);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .topbar::after{
    content:"";position:absolute;left:0;bottom:-1px;height:1px;width:var(--progress);
    background:linear-gradient(90deg,var(--lime),var(--aqua));
    transition:width .42s cubic-bezier(.2,.7,.2,1);
  }
  .brand{
    display:flex;align-items:center;gap:11px;min-width:0;padding:5px 7px;margin-left:-7px;
    border:0;border-radius:12px;background:none;text-align:left;cursor:pointer;
  }
  .brand:hover{background:rgba(21,22,22,.045)}
  .brand-mark{
    position:relative;flex:0 0 38px;width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(20,87,254,.4);
    background:radial-gradient(circle,rgba(20,87,254,.13),transparent 66%);
    display:grid;place-items:center;
  }
  .brand-mark::before{content:"";width:13px;height:13px;border:1px solid var(--lime);transform:rotate(45deg)}
  .brand-mark::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(231,64,43,.12)}
  .brand-copy{display:grid;gap:1px;min-width:0}
  .brand-title{font-size:14px;font-weight:750;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
  .brand-sub{font-size:10.5px;color:var(--paper-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
  .topbar-mid{flex:1;display:flex;justify-content:center;min-width:0}
  .current-pill{
    display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:7px 11px;
    border:1px solid var(--line);border-radius:999px;background:rgba(21,22,22,.035);
    font-size:10.5px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;
  }
  .current-pill .current-name{color:var(--paper);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
  .current-pill .current-sep{color:var(--line-strong)}
  .topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
  .ghost-btn{
    display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);
    border-radius:999px;background:rgba(21,22,22,.035);font-size:11.5px;color:var(--paper-dim);
    cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s,background .2s;
  }
  .ghost-btn:hover{border-color:rgba(20,87,254,.42);color:var(--lime);background:rgba(20,87,254,.055)}
  .ghost-btn .btn-icon{font-family:var(--mono);font-size:13px;color:var(--lime)}

  .rail{
    grid-column:1;grid-row:2;min-height:0;display:flex;flex-direction:column;
    padding:20px 14px 16px 20px;border-right:1px solid var(--line);
    background:linear-gradient(180deg,rgba(21,22,22,.022),transparent 38%);
  }
  .rail-label{font-size:10px;letter-spacing:.18em;color:var(--muted);padding:0 9px 12px}
  .rail-nav{display:grid;gap:4px;overflow:auto;padding-right:2px;scrollbar-width:thin}
  .nav-item{
    position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;
    min-height:50px;padding:7px 9px;border:1px solid transparent;border-radius:12px;
    background:transparent;text-align:left;cursor:pointer;transition:background .2s,border-color .2s;
  }
  .nav-item:hover{background:rgba(21,22,22,.045);border-color:var(--line)}
  .nav-item[aria-current="page"]{
    background:linear-gradient(90deg,rgba(20,87,254,.12),rgba(20,87,254,.025));
    border-color:rgba(20,87,254,.3);
  }
  .nav-item[aria-current="page"]::before{
    content:"";position:absolute;left:-1px;top:11px;bottom:11px;width:2px;border-radius:2px;background:var(--lime);
  }
  .nav-index{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em}
  .nav-item[aria-current="page"] .nav-index{color:var(--lime)}
  .nav-text{display:grid;gap:1px;min-width:0}
  .nav-label{font-size:13.5px;line-height:1.25;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-item[aria-current="page"] .nav-label{color:var(--lime)}
  .nav-kicker{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-foot{
    margin-top:auto;padding:14px 9px 0;border-top:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  }
  .rail-count{font-family:var(--mono);font-size:16px;letter-spacing:-.02em;color:var(--paper)}
  .rail-count small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.12em;color:var(--muted);margin-bottom:3px}
  .compass{position:relative;width:42px;height:42px;border:1px solid var(--line-strong);border-radius:50%;flex:0 0 42px}
  .compass::before{content:"";position:absolute;inset:8px;border:1px dashed rgba(168,127,44,.45);border-radius:50%}
  .compass::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:var(--coral);transform:translate(-50%,-50%)}
  .compass i{position:absolute;left:50%;top:3px;bottom:3px;width:1px;background:rgba(21,22,22,.18)}
  .compass i.x{left:3px;right:3px;top:50%;bottom:auto;width:auto;height:1px}

  .main{grid-column:2;grid-row:2;min-width:0;min-height:0;position:relative}
  .scroll{height:100%;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto;scrollbar-width:thin;scrollbar-color:rgba(21,22,22,.2) transparent}
  .scroll::-webkit-scrollbar{width:9px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(21,22,22,.16);border-radius:99px;border:3px solid transparent;background-clip:padding-box}

  .view{
    position:relative;width:100%;max-width:1380px;min-height:100%;margin:0 auto;
    padding:34px clamp(24px,3.2vw,56px) 20px;display:flex;flex-direction:column;
    overflow-x:clip;
  }
  .view[hidden]{display:none}
  .view:focus,.hero-title:focus,.display:focus{outline:none}
  .view::before{
    content:attr(data-index);position:absolute;right:20px;top:6px;pointer-events:none;
    font-family:var(--mono);font-size:clamp(74px,8vw,132px);line-height:1;letter-spacing:-.06em;
    color:rgba(21,22,22,.028);-webkit-text-stroke:1px rgba(21,22,22,.075);
  }

  .view-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px}
  .view-head-main{min-width:0;max-width:100%}
  .meta-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .kicker{
    display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid rgba(20,87,254,.28);
    border-radius:999px;background:rgba(20,87,254,.055);font-size:10px;letter-spacing:.08em;color:var(--lime);
  }
  .kicker::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--lime)}
  .section-nav{font-size:10px;letter-spacing:.1em;color:var(--muted)}
  .display{
    margin:11px 0 0;font-size:clamp(30px,3.15vw,50px);line-height:1.12;letter-spacing:-.045em;
    font-weight:800;max-width:22em;text-wrap:balance;
  }
  .summary{margin:12px 0 0;max-width:76ch;font-size:clamp(15px,1.08vw,18px);line-height:1.7;color:var(--paper-dim)}

  .data-band{margin:3px 0 22px}
  .band-label{font-size:9.5px;letter-spacing:.16em;color:var(--muted);margin:0 0 9px 2px}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}
  .metric{
    position:relative;min-height:108px;padding:15px 16px 14px;border:1px solid var(--line);
    border-radius:14px;background:linear-gradient(180deg,rgba(21,22,22,.05),rgba(21,22,22,.018));
    overflow:hidden;
  }
  .metric::after{
    content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border:1px solid rgba(168,127,44,.16);
    border-radius:50%;pointer-events:none;
  }
  .metric-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .metric-value{font-family:var(--mono);font-size:clamp(23px,2.12vw,34px);line-height:1;letter-spacing:-.045em;color:var(--paper)}
  .metric-index{font-family:var(--mono);font-size:9px;color:var(--muted)}
  .metric-label{margin-top:5px;font-size:11.5px;line-height:1.5;color:var(--paper-dim)}
  .metric-bars{display:grid;gap:6px;margin-top:11px}
  .bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:9.5px;color:var(--muted)}
  .bar-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-value{font-family:var(--mono);color:var(--paper-dim)}
  .bar-track{grid-column:1/-1;height:5px;border-radius:999px;background:rgba(21,22,22,.1);overflow:hidden}
  .bar-fill{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--lime),var(--aqua));transition:width .65s cubic-bezier(.2,.7,.2,1)}
  .bar-fill.alt{background:linear-gradient(90deg,var(--coral),#f0907f)}

  .research-view .view-head{margin-bottom:10px}
  .research-view .summary{margin-top:9px;max-width:90ch;line-height:1.62}
  .research-view .data-band{margin:0 0 9px}
  .research-view .band-label{margin-bottom:6px}
  .research-view .metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .research-view .metric{min-height:70px;padding:9px 11px 8px;border-radius:12px}
  .research-view .metric-value{font-size:clamp(23px,1.85vw,29px)}
  .research-view .metric-label{margin-top:3px;font-size:11.5px;line-height:1.4}
  .research-view .metric-bars{gap:4px;margin-top:6px}
  .research-view .bar-row{font-size:9px}
  .research-view .bar-track{height:4px}

  .blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;align-items:start}
  .blocks.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .blocks.samples{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .blocks.quotes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .block{
    position:relative;padding:16px 17px 15px;border:1px solid var(--line);border-radius:15px;
    background:linear-gradient(180deg,rgba(21,22,22,.045),rgba(21,22,22,.017));
    box-shadow:0 24px 54px -44px rgba(0,0,0,.95);overflow:hidden;
  }
  .block::before{
    content:"";position:absolute;left:16px;right:16px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(20,87,254,.44),transparent);opacity:.55;
  }
  .block-label{font-size:9.5px;letter-spacing:.12em;color:var(--lime)}
  .block-title{margin:6px 0 8px;font-size:clamp(17px,1.35vw,22px);line-height:1.38;font-weight:750;text-wrap:balance}
  .block-body{position:relative;max-height:7.2em;overflow:hidden;font-size:clamp(14.5px,1.04vw,16px);line-height:1.7;color:var(--paper-dim);white-space:pre-wrap;overflow-wrap:anywhere}
  .block.has-overflow:not(.expanded) .block-body::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2.4em;
    background:linear-gradient(180deg,rgba(241,238,231,0),rgba(241,238,231,.94));pointer-events:none;
  }
  .block.expanded .block-body{max-height:none}
  .block-toggle{
    display:none;align-items:center;gap:5px;margin-top:9px;padding:1px 0;border:0;background:none;
    color:var(--lime);font-size:10.5px;letter-spacing:.04em;cursor:pointer;
  }
  .block.has-overflow .block-toggle{display:inline-flex}
  .block-toggle .toggle-glyph{font-family:var(--mono);font-size:12px;line-height:1}

  .block.sample{background:linear-gradient(155deg,rgba(21,22,22,.085),rgba(21,22,22,.02));border-color:rgba(21,22,22,.22)}
  .block.sample .block-body{max-height:4.1em;overflow:hidden;font-size:clamp(14.5px,1.02vw,16px);line-height:1.7}
  .sample-body{white-space:pre-wrap;font-size:clamp(14px,1.04vw,17px);line-height:1.78;color:var(--paper)}
  .sample-tag{font-family:var(--mono);font-size:.74em;letter-spacing:.04em;color:var(--lime);margin-right:.35em}
  .sample-text{color:var(--paper)}
  .sample-note{display:block;margin-top:.35em;color:var(--paper-dim);font-size:.86em;line-height:1.65}

  .block.quote-card{background:linear-gradient(170deg,rgba(231,64,43,.055),rgba(21,22,22,.018))}
  .block.quote-card::before{background:linear-gradient(90deg,transparent,rgba(231,64,43,.5),transparent)}

  .quote-full-card{margin-top:11px;padding:13px 16px;border:1px dashed var(--line-strong);border-radius:14px;background:rgba(21,22,22,.018)}
  .quote-toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
  .quote-toggle-label{font-size:11px;letter-spacing:.1em;color:var(--lime)}
  .quote-toggle .toggle-glyph{font-family:var(--mono);font-size:17px;line-height:1;color:var(--lime)}
  .quote-full-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);min-height:22px;white-space:pre-wrap;font-size:clamp(14.5px,1.02vw,16px);line-height:1.8;color:var(--paper-dim)}
  .quote-full-body[hidden]{display:none}

  .extra-card{margin-top:11px;border:1px solid rgba(168,127,44,.26);border-radius:14px;background:linear-gradient(180deg,rgba(168,127,44,.055),rgba(21,22,22,.012));overflow:hidden}
  .extra-toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:12px 16px;border:0;background:none;text-align:left;cursor:pointer}
  .extra-toggle-label{font-size:11px;letter-spacing:.1em;color:var(--aqua)}
  .extra-count{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-left:auto;margin-right:10px}
  .extra-toggle .toggle-glyph{font-family:var(--mono);font-size:17px;line-height:1;color:var(--aqua)}
  .extra-body{padding:0 16px 16px;border-top:1px solid var(--line)}
  .extra-quote{white-space:pre-wrap;font-size:clamp(13.5px,.96vw,15px);line-height:1.75;color:var(--paper-dim);padding:14px 0 16px;margin-bottom:12px;border-bottom:1px dashed var(--line-strong)}
  .extra-body[hidden]{display:none}
  .extra-text{padding-top:14px;white-space:pre-wrap;font-size:clamp(14.5px,1.02vw,16px);line-height:1.8;color:var(--paper-dim)}
  .deep-dive-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;padding-top:14px}
  .deep-dive-item{padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:rgba(21,22,22,.022)}
  .deep-dive-item .block-label{font-size:9px}
  .deep-dive-title{margin:5px 0 6px;font-size:14.5px;line-height:1.38;font-weight:750}
  .deep-dive-body{white-space:pre-wrap;font-size:13.5px;line-height:1.72;color:var(--paper-dim)}

  .section-pin{
    margin-top:12px;padding:15px 17px;border:1px solid rgba(168,127,44,.32);border-radius:15px;
    background:linear-gradient(155deg,rgba(168,127,44,.085),rgba(21,22,22,.015));
  }
  .section-pin + .section-figure{margin-top:11px}
  .pin-card + .pin-card{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .pin-title{margin:5px 0 7px;font-size:clamp(16px,1.25vw,20px);line-height:1.4;font-weight:750;text-wrap:balance}
  .pin-body{position:relative;max-height:6.4em;overflow:hidden;white-space:pre-wrap;font-size:clamp(14px,1vw,15.5px);line-height:1.65;color:var(--paper-dim);overflow-wrap:anywhere}
  .pin-card.expanded .pin-body{max-height:none}
  .pin-card.has-overflow:not(.expanded) .pin-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2em;background:linear-gradient(180deg,rgba(241,238,231,0),rgba(241,238,231,.96));pointer-events:none}
  .pin-toggle{display:none;align-items:center;gap:5px;margin-top:7px;padding:0;border:0;background:none;color:var(--aqua);font-size:10.5px;letter-spacing:.04em;cursor:pointer}
  .pin-card.has-overflow .pin-toggle{display:inline-flex}
  .pin-toggle[hidden]{display:none}
  .pin-toggle .toggle-glyph{font-family:var(--mono);font-size:12px;line-height:1}

  .section-figure{
    margin:14px 0 0;border:1px solid var(--line);border-radius:15px;overflow:hidden;
    background:rgba(5,12,11,.6);box-shadow:0 24px 54px -44px rgba(0,0,0,.95);
  }
  .figure-zoom{position:relative;display:block;width:100%;padding:0;border:0;background:#e3dfd4;cursor:zoom-in;text-align:left}
  .figure-zoom img{display:block;width:100%;height:auto;max-height:min(62vh,620px);object-fit:contain;background:#e3dfd4}
  .figure-zoom::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(21,22,22,.04);
    background:linear-gradient(180deg,transparent 72%,rgba(21,22,22,.28));
  }
  .figure-zoom-hint{

  /* ===== Floatboat-native editorial skin (2026-11-11) ===== */
  :root{
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","EB Garamond","Cormorant Garamond",Georgia,serif;
    --sticker:#eff76a;
    --blue:#1457fe;
    --red:#e7402b;
    --paper-bg:#f1eee7;
    --card:#fbf9f3;
  }
  html,body{background:var(--paper-bg)}
  .backdrop{background:
    radial-gradient(1100px 720px at 92% -12%,rgba(20,87,254,.075),transparent 62%),
    radial-gradient(820px 560px at -4% 112%,rgba(231,64,43,.055),transparent 62%),
    var(--paper-bg);
  }
  .backdrop::before{
    background-image:linear-gradient(rgba(21,22,22,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(21,22,22,.055) 1px,transparent 1px);
    background-size:36px 36px;opacity:.55;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 72%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 72%);
  }
  .backdrop::after{display:none}
  .backdrop .horizon{background:linear-gradient(90deg,transparent,rgba(231,64,43,.3) 30%,transparent)}
  .backdrop .beam{background:linear-gradient(180deg,transparent,rgba(20,87,254,.22),transparent)}

  .topbar{background:rgba(241,238,231,.9);border-bottom:1px solid rgba(21,22,22,.18)}
  .topbar::after{background:var(--red)}
  .brand-mark{border:1px solid rgba(20,87,254,.55);background:radial-gradient(circle,rgba(20,87,254,.1),transparent 66%)}
  .brand-mark::before{border-color:var(--blue)}
  .brand-mark::after{background:var(--sticker);box-shadow:0 0 0 4px rgba(239,247,106,.25)}
  .brand:hover{background:rgba(21,22,22,.045)}
  .current-pill{background:#fff}
  .ghost-btn{background:#fff;border-color:rgba(21,22,22,.22)}
  .ghost-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(20,87,254,.05)}
  .ghost-btn .btn-icon{color:var(--blue)}

  .rail{background:transparent}
  .rail-label{letter-spacing:.22em}
  .nav-item{border-radius:2px}
  .nav-item:hover{background:#fff;border-color:rgba(21,22,22,.2)}
  .nav-item[aria-current="page"]{background:var(--blue);border-color:var(--blue)}
  .nav-item[aria-current="page"]::before{background:var(--sticker);width:3px}
  .nav-item[aria-current="page"] .nav-label{color:#fff}
  .nav-item[aria-current="page"] .nav-index{color:var(--sticker)}
  .nav-item[aria-current="page"] .nav-kicker{color:rgba(255,255,255,.74)}
  .compass::after{background:var(--red)}
  .rail-nav .nav-item[aria-current="page"],
  .rail-nav .nav-item[aria-current="page"]:hover{background:var(--blue);border-color:var(--blue)}
  .rail-nav .nav-item[aria-current="page"] .nav-label{color:#fff}

  /* ---------- v43 motion + sample stage ---------- */
  @keyframes v43Rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes v43Fade{from{opacity:0}to{opacity:1}}
  @keyframes v43Draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes v43Film{from{width:0}to{width:100%}}
  @keyframes v43Sweep{0%{top:-70%}55%{top:130%}100%{top:130%}}
  @keyframes v43Strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .view.is-in .reveal{animation:v43Rise .52s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--i,0) * 34ms)}
  .hero-right{overflow:hidden}
  .hero-right::after{content:"";position:absolute;left:-25%;right:-25%;top:-70%;height:45%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.16),transparent);transform:rotate(-7deg);animation:v43Sweep 9s ease-in-out infinite;pointer-events:none;z-index:0}
  .home-cards{position:relative;z-index:1}

  .hero-trace{position:relative;z-index:1;display:grid;gap:7px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(247,244,236,.22)}
  .trace-label{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:rgba(247,244,236,.62)}
  .trace-line{position:relative;display:block;height:1px;background:rgba(247,244,236,.24)}
  .trace-line i{position:absolute;top:-2px;left:0;width:5px;height:5px;border-radius:50%;background:var(--sticker);box-shadow:0 0 0 4px rgba(255,222,89,.16);animation:v43Trace 5.2s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes v43Trace{0%{left:0;opacity:0}8%{opacity:1}55%{left:calc(100% - 5px);opacity:1}72%{left:calc(100% - 5px);opacity:0}100%{left:0;opacity:0}}

  .custom-stage{margin:5px 0 0}
  .v43-label{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin:0 0 6px;font-size:9.5px;letter-spacing:.14em;color:var(--lime)}
  .v43-label span{color:var(--muted);letter-spacing:.05em;font-size:9px}

  .v43-sample{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,.98fr);gap:10px;align-items:stretch}
  .v43-story,.v43-script{background:#fff;border:1px solid rgba(21,22,22,.18);box-shadow:4px 4px 0 rgba(21,22,22,.085);padding:10px 12px 11px;min-width:0}
  .filmstrip{position:relative;aspect-ratio:2/1;overflow:hidden;background:#151616}
  .frame{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
  .frame.is-active{opacity:1;pointer-events:auto}
  .frame img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.94) contrast(1.02)}
  .frame figcaption{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 11px;background:linear-gradient(transparent,rgba(10,10,10,.8));color:#f7f4ec;font-size:11px;line-height:1.5}
  .frame figcaption b{font-family:var(--mono);color:var(--sticker);margin-right:8px;font-weight:600}
  .film-progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.2);z-index:2}
  .film-progress i{display:block;height:100%;width:0;background:var(--sticker);animation:v43Film 3.8s linear infinite}
  .film-dots{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:3}
  .film-dots button{width:7px;height:7px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.72);background:transparent;cursor:pointer}
  .film-dots button.is-on{background:var(--sticker);border-color:var(--sticker)}

  .script-body{font-family:var(--serif);color:var(--paper)}
  .script-body .scene{margin:0 0 3px;font-family:var(--sans);font-size:11.5px;line-height:1.55;color:var(--muted)}
  .script-body .line{margin:0 0 7px;font-size:clamp(15px,1.2vw,17px);line-height:1.48;letter-spacing:-.01em}
  .script-body .line.strong{font-weight:700;font-size:clamp(17px,1.4vw,20px)}
  .script-body .beat{margin:0 0 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--coral)}
  .v43-note{margin:8px 0 0;padding-top:6px;border-top:1px dashed var(--line-strong);font-size:9.5px;line-height:1.5;color:var(--muted)}

  .v43-sample-row{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:10px;margin-top:8px;align-items:start}
  .xhs-card{display:grid;grid-template-columns:132px minmax(0,1fr);background:#fff;border:1px solid rgba(21,22,22,.18);box-shadow:4px 4px 0 rgba(21,22,22,.085);min-width:0}
  .xhs-cover{width:100%;height:100%;object-fit:cover;display:block}
  .xhs-body{padding:9px 12px 10px;min-width:0}
  .xhs-meta{font-size:9px;letter-spacing:.13em;color:var(--lime)}

  .qs-verdict{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line-strong);font-family:var(--serif);font-size:clamp(17px,1.7vw,25px);text-align:center}

  @media (max-width:1120px){

  }
  @media (prefers-reduced-motion:reduce){
    .view.is-in .reveal,.view.is-in .dayline-track i,.view.is-in .qs-first .qs-strike,.film-progress i,.hero-right::after{animation:none!important}
  }

<script>
(function () {
  "use strict";

  const data = {"siteTitle":"傅珩｜Floatboat AI 产品运营展示","siteSub":"把新产品从没人用推到有人用、留下来","home":{"kicker":"产品运营 / 业务复盘与实测诊断","title":"傅珩｜面向 Floatboat 的产品运营复盘与诊断","intro":"我是傅珩，应聘 Floatboat 的 AI 产品运营。这份展示梳理了我过往的运营复盘、对 Floatboat 当前版本的实测诊断，以及一份进组后计划推进的运营方案。遇到转化与留存断点时，先用外部物料做轻量验证，有了明确数据再协同产研评估端内改造。","signal":"先不动代码做外部验证，摸清卡点再协同产研评估。","claim":"来做产品运营，懂产品逻辑，也知道数据能说明到哪一步；先用运营动作跑出可验证结果，再带着结果协同产研评估。","actionPreview":"我能看出哪儿漏，也能在不写代码的情况下先堵住四道关。先动 0、1、3、4；第 2 关的核心触发需要研发，运营先做演示和回访。","evidenceNote":"Floatboat 诊断来自六人首测、一家三人工作室与九人访谈，属于定性线索，不推及大盘；过往项目数据另行注明单次观测与同期对照口径。","transition":"","cards":[{"label":"方法迁移","title":"LiblibAI 模块承接复盘","detail":"会员体验实验的数据怎样改变了后续承接方向。"},{"label":"实测诊断","title":"Floatboat 卡点与创作者方案","detail":"诊断与创作者方案是当下要解的题，所以接着看用户卡在哪、运营先动哪几道关。"},{"label":"数据查验","title":"云集五表查数与选品建议","detail":"云集实习：先排查专题页断点，再给出选品替换、模块顺序与价格锚点建议。"}]},"sections":[{"id":"growth","nav":"模块承接复盘","kicker":"LiblibAI 模块承接复盘","title":"LiblibAI：能力开放观测与场景化承接调整","transition":"","summary":"在 2024.08–2025.09 项目制合作期间，我负责文生图入口、模型广场生成路径、生成结果页三个模块的运营承接与数据回收；会员体验方案由商业化团队推进。两万四千人同期分流、跑满两周的会员体验实验，会员付费转化率为 21% 对 20%，本次实验相差 1 个百分点，未达到预设的 3 个百分点以上改版判断线，因此没有继续沿单纯开放高阶能力的方向改版。团队转回具体场景承接，后续单独观测到一键同款入口新用户七日留存达到 27%（该入口用户存在自选择偏差，与会员实验非同一批人，不作前后对比）。","stats":[{"value":"21% 对 20%","label":"会员付费转化率（商业化团队推进，本人负责三个模块承接与数据回收；两万四千人分流跑满两周，1 个百分点差距不值得再改版）"},{"value":"27%","label":"一键同款入口新用户七日留存（单独观测，该入口用户有自选择偏差，与会员实验非同一批人不做前后对比）"}],"blocks":[{"label":"实验观测","title":"开放高级体验的分流观测","body":"我最初曾推测，免费积分不足限制了文生图入口新用户的探索。会员体验方案由商业化团队推进，我负责文生图入口、模型广场生成路径、生成结果页三个模块的运营承接与数据回收。这次会员体验实验观测的是会员付费转化率，留存是否改善不在这次实验的回答范围内。两万四千人两组各一万二随机分流跑满两周，会员付费转化率为 21% 对 20%。实验原本设定抓 3 个点以上能改变决策的改善，实际仅差 1 个百分点，即使真实存在也不值得为它再改一次版。本次会员体验实验的付费转化率差距未达到改版判断线，不支持继续沿这一路径改版。"},{"label":"承接调整","title":"从开放权限转向直观呈现场景差异","body":"一些获得高阶权限的用户仍只生成简单头像，我据此提出一个待验证的假设——拿到高级能力的人，可能缺少具体场景的示范。围绕这个假设，我提了三条承接方向：一是在负责的入口推荐位做同提示词双图并排，基础模型与高级模型各一张，让视觉落差直接呈现；二是在推荐卡片上按具体出图场景提供预设配置组合，减少参数配置困惑；三是调整生成结果页动线，强化下一步引导。"},{"label":"入口观测","title":"一键同款入口新用户的独立观测","body":"可复制配置由产品端上线，本人负责生成结果页的运营承接与数据回收。一键同款入口引入的新用户七日留存测得 27%。需要说明的是，该数据为单独观测，这批用户带着明确模仿目标进站，具有自选择偏差，与前述会员实验不同批，两者不做前后对比。"}],"deepDive":[{"label":"方法迁移说明","title":"假设复盘：为什么高级权限没有拉动留存","body":"这次经历让我转向一个待验证的判断：与其只推荐更高阶能力，不如先示范具体场景怎么用。面对 Floatboat，我想先做一轮内容测试：呈现人离开屏幕后的交付过程，观察用户能否理解适用任务、是否愿意尝试。"},{"label":"电商动线排查","title":"云集实习：五表关联定位专题页断点","body":"云集实习期间，我写 SQL 关联流量来源、埋点事件、订单支付、商品维表、用户标签五张表，点击和加购在同一张事件表按 event_type 拆，排查 30 万+行事件明细，对应专题页 UV 约 2.1 万。我据此判断专题页尾模块可能缺乏承接；按首单品类分层，结合后续复购表现，提出选品替换、模块顺序调整与价格锚点设置建议；页面由运营同学配置，我负责拉取数据并给出分析结论。改版后该店周销 +18.2%，同期以未改版店铺作对照；该周期含大促预热，这个数不单独算作个人功劳，也不当作改版净效果。"},{"label":"合作边界","title":"职责范围与项目制收尾","body":"2024.08 至 2025.09 期间以项目制形式合作，依既定周期正常收尾。我专注负责文生图入口、模型广场生成路径、生成结果页三个模块的运营承接与数据回收，涉及底层的商业化机制由对应团队推进。"}]},{"id":"research","nav":"用户诊断","kicker":"Floatboat 实测诊断","title":"Floatboat 诊断：四个观察层次与运营验证关卡","imageCaption":"Floatboat Agent 空间与任务列表界面官方参考图","imageAlt":"Floatboat Agent 空间与任务列表界面官方参考图","transition":"","summary":"基于 2026.11 测试版本 v0.6.4 进行诊断。样本包含六人可用性首测（2/6 跑通且成果被采用，2/6 部分完成，2/6 未跑通，3/6 三天内主动再次打开；1/6 回访说起过过去偶然看见自主行动，非本轮到达 Aha）、一家三人工作室（n=1），以及 9 人分层口述访谈。全口述无录屏，不可推及全量市场。我查阅的公开横评多以单次跑分和代码准确率为量尺，其中较少单独评价离机托付。为此拟定了进组后推进的 Combo Skills 创作者方案与五道关运营动作。","stats":[{"value":"2 / 6","label":"六人首测口述反馈中任务跑通且成果被实际采用的比例"},{"value":"3 / 6","label":"六人首测回访记录中三天内主动再次打开客户端的受测者比例"},{"value":"1 / 6","label":"回访说起过过去偶然看见自主行动（属过去偶然经历，非本轮到达 Aha）"}],"blocks":[{"label":"衡量尺度","title":"横评量尺错位：第二把尺子的认知真空","body":"我查阅的公开横评多以单次跑分和代码准确率为量尺。对需要离机托付的用户，更值得看的，是人离开电脑后任务能否完成、是否需要中途干预。这个角度可以先拿去做内容测试。"},{"label":"首测卡点","title":"六人首测暴露的三处不确定感","body":"六位受测者口述记录显示：2/6 跑通且成果被采用，2/6 部分完成，2/6 未跑通，3/6 三天内主动再次打开。核心卡点来自三处不确定：不确定后台在不在跑导致不敢关窗口、不确定存完的技能生效没有导致不敢调用、不确定绑定本地哪个文件夹导致担心覆盖原文件。"},{"label":"协同资产","title":"协同资产阻碍与创作者生态供给","body":"一家三人设计工作室口述反馈（n=1）：主理人称已改到第三版，设计师仍看到第一版，后来退回微信群与网盘协作；本轮没有复现这一现象。另一次个人挂载实测中，我将此前在其他工具积累的 3 个本地项目目录挂载为空间，官方指南另有 Codex／Claude Code 项目导入路径；本次挂载中，历史会话被平铺展开为上千条一级线程，61 个技能、300 多个协议文件与 200 多个工具脚本未被读取。"}],"deepDive":[{"label":"创作者方案","title":"Combo Skills 创作者生态方案（进组后计划）","body":"优先招募有稳定重复做法的人，不以粉丝量作为筛选门槛。筛选标准聚焦三条：有重复做的事、能说清具体步骤、愿意署名。计划先打磨十个技能，逐个做小批验证：事先写明运行前提与预期结果，记录试用者能否指出适用场景、能否得到预期结果；未达到预期的样本单独记录，修改后复测，试用人数和扩量标准在测试前确定。提供参数示例并标明运行前提，优先测试会议纪要、竞品查证、周报汇总等高频场景。先用外部物料收集用户想试用的具体场景与试用报名，再协同产研评估端内创作者展示与主页跳转。"},{"label":"反馈管道","title":"用户卡点信号过滤管道（进组后计划）","body":"进组后收集用户反馈，用 AI 辅助按五道关归类，人工复核具体任务、影响和已有替代做法；能用运营动作验证的先验证，再按周整理问题、证据与验证结果，与产研讨论优先级。"},{"label":"样本与证据边界","title":"实测样本范围与观察局限说明","body":"测试样本来自社群报名的六位可用性测试用户，全口述无录屏；三人设计工作室仅有一家（n=1）；另有 9 人分层访谈，因跨天与非跨天两批任务类型不同，样本间不可直接对照。本诊断仅作为提出运营假设的定性参考，不可推及全量市场大盘。"},{"label":"资产迁移实测","title":"本地文件夹挂载的独立观测口径","body":"这些资产来自此前在其他工具中的积累，不代表 Floatboat 使用时长。本次实测仅将三个本地项目目录挂载为空间，官方指南另有 Codex 与 Claude Code 项目导入路径；本次观察到部分资产未被读取、线程平铺，未读取的具体原因及其他导入方式的覆盖范围仍待实测。"}],"imageData":"data:image/webp;base64,UklGRqLQAABXRUJQVlA4IJbQAADwkwOdASpABvoDPmEwlUgkIqIhoZPo4IAMCWlu++6sbk2BacvYWHmjyXy2qf2b/hNer79+XvtSWL/Kfiz49MDLvf9l5gfKH/K/uH5Z/Ob/Tf7j2YfoP/G/n/9AH9c/qHnVfsB7xP7R/z/UB+x/7Me7L/gv+j/c/cX/Xf8j+wvwDf13/C/+zsNP3L9gr+Mf53/8+up+4Hwif1z/ifub8Dn7If/jrAP/p1q/Vz+zf4P9hPgX38fZv8Z+w3+B9J/xb5T+t/2f/F/5P+yf/f/TfFZ/N/4n9zPQV61/Kf7H/QepP8g+wf3f+2/4f/kf3D97fuv+2/4z/Bftl/iP3j9l/zf9o/yf93/cz/IfIL+Pfyn+9/2j9xf7N++H2F/H/6L/Tf679iPGv0v/Hf6L/I/uZ+//0Bepvzn/Lf3n/I/9b/B/vd893uH+W/u/7j/3H///JX6H/Zf81/i/3c/wH///AD+R/z3/J/3L93f8X////d93f6r/qfnt6O32X/Xf9f/K/m79gX8s/rn/A/w3+l/9/+V//////F3+d/6v+X/1P7Uf//30fnn+U/6/+Z/1H7S//////oT/L/6x/wP8D/n//r/nv/////vn//f/a+Df7y////y/DP+6f///3ocbam0Zb+8XLpah1IRWKC2K3QnaMWvlQkn4L4X+wt/0dSI+RcH2uKKIr1mWbpar0lNyMizBl16ix0x3gJMSYkxJiTEmJMSYkwzD74YJOJ8T4nxPifE+J7/2tAVJrQkkrTXksYTlSTRzkAV4sMrYf8eQ6xqNW9SjWIkzP/GuPGdRVNX/ljpkHinC0/SCbtSsbfMnCoIPGcc1rJE48yaRBVXJGoNmlKyH9XcxZN98cu4YGTsNNjJCc5MsSHlyZEmBDDgTi8tyUBuu0355uRJVQQSIEChyFk3JuTcm5Nybk2/wh/Kgeen7aJp0L1B5ZavDS6sNLjWi/DlaQI7fbH5XkOtRds4KewdqW3wYCwFgLAWAdnAODUW61j9T71hr4BCNEFMFAkOj+ecNApeA5xAaSW34OLRxJIULU/JsU32II4F6F+dyBImzSiJv2XvoL8IhvZoQSLh+QDXneCb5V05MffEkM1LF9xKBvA6SP2KCNs/v9x5y1arVRCsjH99px2IxUFPthLpZSbHItJ9Z4wbhCoAKwANURcS4lxLiXEuJZRniduuvbyUXlw3UCTTe+CScuEqeBlMLrnmVk2wIj1gJGAfwJfSaw2rHC ss=\"line\">刚才，我走开了一会儿。</p>\n      <p class=\"scene\">（画面：同一个位置，人回到工位，一份排版好的材料在桌面上）</p>\n      <p class=\"line\">等我回来，它把这个做完了。</p>\n      <p class=\"beat\">（停顿 1 秒）</p>\n      <p class=\"line strong\">我没问它。它也没等我。</p>\n      <p class=\"scene\">（字幕：有些活，你不用问它）</p>\n      <p class=\"line\">这一分钟，我告诉你——它怎么知道该干什么。</p>\n    </div>\n    <p class=\"v43-note\">未投放。分镜为情境示意，实拍待自主运行稳定触发验证后开机。</p>\n  </div>\n</div>\n<div class=\"v43-sample-row\">\n  <article class=\"xhs-card\">\n    <img class=\"xhs-cover\" src=\"data:image/webp;base64,UklGRty4AABXRUJQVlA4INC4AABQPQOdASrQAjgEPm0ylkkkIqyxIhBaKiANiWlqWWnUrvf/8zhfb//zmr/+W7/nv/5zSf/+5M8Xkx///TK/S///qwNBv/Rziv//za/fY0q9xLOh9l7/MbN/rH+l/a3nR9D/tf/O8f/7bwhKAX87/sn+99dnDDoA8ZXP8/4X7bexf+xf7Dot8+qhf/H5+Rds5+o/zD9X1JOJJFfb/52/GP5c+Jn2AOgz5k/2e9XP8OfeJ+yn5AfIB+kXW7+gT/M/+76zv/r9pXBHv/f5+flX+D/ze5v+t8n//YuYckH5z+o/7P+T9o3/P5C8Aj3J/wOMT6rzEe9f69+nn+1+yXs7+9f7j/ye4J+o3/a/ufnteaB+W/7HsGfzn+/+ld9desn9I9Rb+af44X8z9zwXgMdl0nOHYxLyByCQrxptFspDR+ePVsKm/B66q1p3WEoBZHwSsd+rfVsA7hNC9WSq4OX1yuGwFvzI5v3XJCC5658WvJtjW4pM1FXuf+FIqlo7YcmEw7f83e6/JWoEO5ML28rRihK0Xt7mHNgzgI0aYla0+v2M0LLgxlo4N3WmGecs3+Tmc9k+p33kXAOfzZuAqOlJb758vBZqpBHb34EGwuJz5FGdn835MiaKLTRea3I1s/KUZelgEskREc0i4AD9Yq3YRBWjvQ0LQHvc9eirK5KlPQhk1Qv1Dt3lGNTNIlU5ucjCFDb4ARchrYdDDhZzV0XcdzAVSa+mjOkbgYhHz6k4JpMa1+zOe+8eVKLmo47skT23IwSgxE0ovH3YXZ7SvNAj8JJ9PoCgOEflDhFlREE9MGqHcMD+c1Nih1rhiBjJc1G8NKO4vZpJRxvgKCa5YnDmriwcILw/IkHRnMFWHcb0V3xpPYtJ7yjpub2ErKlMrteG6vmx7zol+Wk6bfgFVNFdV6fDY515IhbGiVWVOrTC2rjFhCXOe27XcDspCIxUJQiRY9e6Pv1gEtMjABxJeo33fmR64OS851UaWn3nNxfsnu8xiOynW5mrY6fzdoJ34kb6uEqTp5CVeLXOqSbPoQzWA1f/zlPvimgaqpm2Y2BRHveu11uJQDSOWFgoEeW1ZOJ+v9NomFr1fgEHXLSPo6T6y79IaHzq0O/YJfLKyhhBK6djEzmOXb4INvhJufMDldPLfmaUH/g2nHi3TdBRqHrUsk+nRehNLMYBAzwX9HSb83CJBm45lVedTJJLV+G5Az1HUFo5CxC3G5nkLxpiaZIFHIaphnwPwwPiyccL7EvhsaMskaNZIusgEWo1EF4cmZxaPE+sW9fcL7Snasrt7K4ETLYNkx/cMIIb3K8XSYmGHw158OhTlNJ/VIs05OMFAbI3//y4/FwJbn43rX1iqvzIsgtqg2VQ3lgX39bKNsM8b6OlRpybSlDiAzOkpXNaWl+L5f9fYr3XRHBMJGhGqj/USSA8pKv5+9imB7Y0DOSrQ 是个工具，是个同事。</p>\n      <p class=\"xhs-note\">情境构想，未投放。</p>\n    </div>\n  </article>\n  <div class=\"title-lab\">\n    <div class=\"v43-label\">标题三选一</div>\n    <div class=\"title-option\">\n      <p class=\"to-line\"><span class=\"to-kind\">定义式</span>Floatboat：一站式 AI 工作空间</p>\n      <p class=\"to-why\">适合官网，放信息流里不抓新客。</p>\n    </div>\n    <div class=\"title-option\">\n      <p class=\"to-line\"><span class=\"to-kind\">痛点式</span>你的时间，都浪费在跟 AI 反复解释你要什么</p>\n      <p class=\"to-why\">先质疑用户现有习惯，容易引起防备。</p>\n    </div>\n    <div class=\"title-option is-picked\">\n      <p class=\"to-line\"><span class=\"to-kind\">时刻式 · 选用</span>有些活，你不用问它</p>\n      <p class=\"to-why\">拿掉「问」这个动作，和对话助手直接区隔；短，能复述。</p>\n    </div>\n  </div>\n</div>\n"},{"id":"workflow","nav":"AI 工作流","kicker":"一天实录","title":"一天实录：AI 负责铺开，人做拍板判断","transition":"","summary":"记录单日运用 AI 工具辅助分析访谈与制作素材的实际过程。Claude 用于六人首测的 6 份访谈记录聚类；Cursor 协助排错抓取脚本；ComfyUI 跑出 14 张候选视觉图；信息筛选、脚本运行确认与文案定稿由我复核。","stats":[{"value":"9 / 14","label":"Claude 从六人首测的 6 份记录中归纳 14 条候选问题，人工初筛后保留 9 条待验证卡点（不与 9 人分层访谈相加）"},{"value":"1 / 14","label":"ComfyUI 跑了 14 张封面候选，我选了 1 张极简留白图"}],"blocks":[{"label":"文本梳理","title":"访谈笔记聚类与口语提炼","body":"用 Claude 整理六人首测的 6 份访谈记录，归纳出 14 条候选问题。我删掉了 5 条：3 条混淆产品没做与用户没懂，2 条把抱怨当需求，留下 9 条待验证卡点。文案由 Claude 提供备选，我再修改定稿。"},{"label":"代码出图","title":"抓取排错与视觉调性把控","body":"编写网页数据抓取脚本遇到动态加载问题，借助 Cursor 排查滚动等待逻辑，调试两轮后脚本跑通；使用 ComfyUI 批量生成 14 张封面候选，筛选后选定 1 张极简留白图。"}],"deepDive":[{"label":"节点记录","title":"单日四个工作节点的工具与人机分工","body":"09:10 借助模型整理六人首测的 6 份访谈笔记并归类卡点；11:20 编写并排查动态评论抓取脚本；14:00 调整提示词并筛选封面成图；20:30 人工推敲并确定最终文案样稿。"},{"label":"分工原则","title":"工具铺开选项，人工负责调试与终稿","body":"这一天里，AI 帮忙整理访谈记录、生成候选素材；卡点是否有依据、脚本当次能否跑通、物料是否契合产品定位，由我复核。"}],"stageAfter":"\n<div class=\"dayline\">\n  <div class=\"dayline-head\"><span>09:10 — 20:30</span><span>同一天，四个节点</span></div>\n  <div class=\"dayline-track\"><i></i></div>\n  <div class=\"day-grid\">\n    <div class=\"day-node\"><b>09:10</b><span>访谈聚类</span><em>Claude 归 14 条，我删 5 条</em></div>\n    <div class=\"day-node\"><b>11:20</b><span>抓取排错</span><em>懒加载只抓到 3 条，改两轮跑通</em></div>\n    <div class=\"day-node\"><b>14:00</b><span>封面筛选</span><em>ComfyUI 出 14 张，我选 1 张</em></div>\n    <div class=\"day-node\"><b>20:30</b><span>文案定稿</span><em>模型给备选，我改到能开口</em></div>\n  </div>\n</div>\n"},{"id":"quote","nav":"关键原话","kicker":"一句原话","title":"访谈原话：保存动作与实际生效的差距","transition":"","summary":"受访者前半程自述「我记得我把它存下来了」，结尾追问时他说「试了也不知道对不对」。两句原话显示出动作完成与拿到结果之间的断层。这一例让我不再把保存自述直接记为功能可用，后续拟附带测试口令，核对用户能否跑出预期结果。","stats":[],"blocks":[{"label":"原话反差","title":"「我记得我把它存下来了」与「试了也不知道对不对」","body":"受访者在前半场提及「我记得我把它存下来了」，我当时在记录里写的是：功能正常，用户完成了保存；但在尾声追问实际调用时，对方说出「试了也不知道对不对」。仅凭用户自述「存下来了」，还不能确认保存是否成功、调用是否得到预期结果。"},{"label":"行动响应","title":"提供外部测试口令与核验规则","body":"先在外部验证：在外部指南与首发技能说明中附上现成的测试口令与预期结果，让用户在保存后当场自检效果；后续回访重点观察用户能否顺利跑出第一次预期结果，待数据明朗后再协同产研评估端内反馈设计。"}],"deepDive":[{"label":"访谈规则修正","title":"「做完动作」与「拿到结果」的认知鸿沟","body":"这一例让我改了一条记录规则：用户说存下来了，先只记动作完成，不记功能正常，等核对调用结果再说。"}],"stageAfter":"\n<div class=\"quote-stage\">\n  <div class=\"qs-row qs-first\">\n    <span class=\"qs-time\">前半场</span>\n    <p class=\"qs-line\"><span class=\"qs-hit\">「我记得我把它存下来了」<i class=\"qs-strike\"></i></span></p>\n    <span class=\"qs-mark\">我记成：功能正常</span>\n  </div>\n  <div class=\"qs-row qs-second\">\n    <span class=\"qs-time\">尾声</span>\n    <p class=\"qs-line\">「试了也不知道对不对」</p>\n    <span class=\"qs-mark alt\">实际：动作完成，结果没验证</span>\n  </div>\n  <div class=\"qs-verdict\">保存成功 <span>≠</span> 拿到结果</div>\n</div>\n"}],"gates":[{"stage":"0 选型期","operation":"计划先实测真实业务中的长任务，记录能否完成、中途是否需要干预、成果是否被采用；有可复现案例后，再联络博主参与展示。","development":"这一关先由运营动作推进，不需要产研前置改造。"},{"stage":"1 头三分钟","operation":"制作 60 秒跟随演示，将易跑通的高频场景整理为拿来即用的外部参考模板。","development":"先记录用户能否理解外部模板的任务、成果是否被采用，作为初步线索，再协同产研评估首次进入时应先展示哪些内容。"},{"stage":"2 第一次「它自己动」","operation":"外部教程集中呈现静默执行的那一瞬间，社群第二天回访先问「昨晚它有没有帮你做完什么」，再核对中途是否需要干预、结果是否被实际采用。","development":"第 2 关的核心触发需要研发；运营先记录现有自主运行的反馈，再与产研共同评估触发及完成告知机制。"},{"stage":"3 存了不用","operation":"在外部技能说明中标注「什么时候用它」，计划打磨十个标杆技能，提供参数示例并标明运行前提。","development":"先记录用户是否看到时机说明、是否使用参数示例、能否完成调用，作为初步线索，再协同产研评估卡片改版与参数预填。"},{"stage":"4 搬进来","operation":"本轮只测本地文件夹挂载这一种方式，说明哪些资产被读取、哪些未被读取；整理已有更新记录，提供本地文件夹绑定空间的迁移指引。","development":"先验证迁移指引与文件夹挂载的实际反馈，再协同产研确认迁移和线程展示中的问题是否需要端内调整。"}],"controls":{"overview":"概览","detail":"展开明细","source":"数据来源","boundary":"实测与证据边界","previous":"上一项","next":"下一项","close":"收起","navLabel":"快速导航","current":"当前浏览","operation":"运营动作","development":"产研协同","evidence":"实测证据","open":"展开","report":"汇报","gates":"五道关","claim":"核心主张","actionPreview":"进组动作预览","evidenceNote":"证据边界口径","transition":"承接过渡","works":"六件作品","sample":"样本边界","firstMove":"进组先做什么","evidenceMap":"证据地图","readOrder":"阅读顺序"},"boundaryFull":"必须要说明这些推论背后的边界。\n样本量很小：首次体验 6 人，三人工作室只有一个且 n=1，外加 9 人分层访谈，跨天与非跨天两批样本不能对照，这些观察不能推及市场。\n整个测试没有录屏，全部来自使用者的口头自述，无法排除回忆偏差或美化表达。\n我的发现和公开评价不能直接对照。官方发布是 5 月 26 日，公开评价集中在 5 月底到 6 月初，现在版本已经是 v0.6.4。只能说这条路上有别人踩过同样的坑，不能说现在还是这样，也不能说已经修好了。","quoteFull":"做用户诊断时，这句话直接改了我的判断。\n\n场景\n第 5 位，独立开发者，任务是把需求整理流程做成技能。\n\n访谈前半段，他说：\n\n「我记得我把它存下来了。」\n\n我在记录表里写的是：技能功能正常，用户完成了保存。\n\n如果访谈到这里结束，这条就是「功能可用」的证据。\n\n后半段\n同一场访谈快结束时，聊到他下次会不会还用，他说了另一句：\n\n「试了也不知道对不对。」\n\n我追问：你试过吗？\n\n他说：试过几次，但看不出来对不对。\n\n我回头翻了前面的记录\n他说「我记得我把它存下来了」的时候，用的是「我记得」，不是「我确认过」。\n\n整场访谈里，他一次都没有描述过「我怎么验证它生效了」这个动作——因为他没有这个动作。\n\n我改了什么\n一，报告里那条从「功能正常」改成「无验证手段」。 这两个判断走的是两条路：前者是「可以了」，后者是「要补一个让用户能判断的信号」。\n\n二，先不动代码，在外部教程和首发技能说明里附上测试口令，先验证一轮。连“存下来”都判断不了，“找不到”很可能不是命名问题，而是没弄清“这东西是什么”，有数据再改产品。\n\n三，给访谈记录加了一条硬规矩：前段的自评必须和后段的细则对照。对不上的地方，就是真问题。\n\n为什么是这一句\n因为它证明了一件事：用户会把自己没成功的事，说成成功了。\n\n他不是一个不配合的用户，他很认真地用了、很认真地回答了。但他对「成功」的定义是「我做完了动作」，不是「我拿到了结果」。\n\n这两者之间的差距，是所有产品都会遇到的坑——而且它不会以投诉的形式出现，只会以沉默的方式出现。\n\n核心洞察提炼（30 秒版）\n有一个人跟我说「我把它存下来了」，我差点就记成功能正常。但同一场访谈快结束时他说「试了也不知道对不对」。\n\n我才意识到，他前面那句「我记得」，其实是在说他做完了动作，不是拿到了结果。\n\n从那一句开始，我把「用户说成功了」和「用户真的成功了」分成了两件事。 后来这份报告里最难修的那一类问题，全是这两者的差距。"};

  const esc = function (value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  };
  const txt = function (value) {
    return value == null ? "" : String(value);
  };
  const asText = function (value) {
    if (Array.isArray(value)) return value.map(txt).join("\n\n");
    return txt(value);
  };
  const join = function () {
    return Array.prototype.slice.call(arguments).map(txt).filter(Boolean).join(" · ");
  };
  const pad = function (n) {
    return String(n).padStart(2, "0");
  };
  const byId = function (id) {
    return document.getElementById(id);
  };
  const controls = data.controls || {};
  const home = data.home || {};
  const sections = Array.isArray(data.sections) ? data.sections : [];
  const gates = Array.isArray(data.gates) ? data.gates : [];
  const quoteSection = sections.find(function (section) { return section && section.id === "quote"; });
  const quoteFull = asText(data.quoteFull || (quoteSection && quoteSection.quoteFull));
  const boundaryFull = asText(data.boundaryFull);
  const boundaryLabel = txt(controls.boundary);
  const overviewLabel = txt(controls.overview);
  const gateLabel = txt(controls.gates) || "五道关";
  const navLabel = txt(controls.navLabel);

  const sectionEntries = sections.map(function (section, index) {
    return {
      id: txt(section.id) || "section-" + pad(index + 1),
      label: txt(section.nav) || txt(section.title) || pad(index + 1),
      index: pad(index + 1),
      kicker: txt(section.kicker),
      section: section,
      sectionIndex: index
    };
  });

  const viewEntries = [
    { id: "overview", label: overviewLabel, index: "00", kicker: txt(home.kicker), kind: "overview" }
  ].concat(sectionEntries.map(function (entry) {
    return { id: entry.id, label: entry.label, index: entry.index, kicker: entry.kicker, kind: "section", sectionIndex: entry.sectionIndex };
  }));

  if (gates.length) {
    viewEntries.push({ id: "gates", label: gateLabel, index: gateLabel, kicker: join(controls.operation, controls.development), kind: "gates" });
  }

  const navEntries = viewEntries.filter(function (entry) { return entry.kind !== "gates"; });
  const order = navEntries.map(function (entry) { return entry.id; });
  const entryById = {};
  viewEntries.forEach(function (entry) { entryById[entry.id] = entry; });

  function navButtons(compact) {
    return navEntries.map(function (entry) {
      const aria = join(entry.label, entry.kicker) || entry.index;
      if (compact) {
        return '<button class="dock-item" type="button" data-view="' + esc(entry.id) + '" aria-label="' + esc(aria) + '">' +
          '<span class="dock-idx">' + esc(entry.index) + '</span>' +
          '<span class="dock-label">' + esc(entry.label) + '</span>' +
          '</button>';
      }
      return '<button class="nav-item" type="button" data-view="' + esc(entry.id) + '" aria-label="' + esc(aria) + '">' +
        '<span class="nav-index">' + esc(entry.index) + '</span>' +
        '<span class="nav-text"><span class="nav-label">' + esc(entry.label) + '</span>' +
        (entry.kicker ? '<span class="nav-kicker">' + esc(entry.kicker) + '</span>' : '') +
        '</span></button>';
    }).join("");
  }

  function chartBars(stat) {
    const raw = txt(stat && stat.value);
    const label = txt(stat && stat.label);
    const fraction = raw.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
    if (fraction) {
      const total = Number(fraction[2]);
      const value = Number(fraction[1]);
      if (total > 0 && value >= 0) {
        return [{ label: "", value: raw, pct: Math.min(100, Math.max(0, value / total * 100)), alt: false }];
      }
    }
    const parts = raw.split(/\s+vs\s+/i);
    if (parts.length > 1) {
      const shortLabels = (label.indexOf("体验组") !== -1 && label.indexOf("对照组") !== -1)
        ? ["体验组", "对照组"] : [];
      const labelParts = label.split(/\s+vs\s+/i);
      return parts.map(function (part, index) {
        const n = parseFloat(part);
        if (!isFinite(n)) return null;
        return {
          label: shortLabels[index] || (labelParts.length === parts.length ? labelParts[index] : ""),
          value: part,
          pct: Math.min(100, Math.max(0, n)),
          alt: index > 0
        };
      }).filter(Boolean);
    }
    const n = parseFloat(raw);
    if (isFinite(n) && raw.indexOf("%") !== -1) {
      return [{ label: "", value: raw, pct: Math.min(100, Math.max(0, n)), alt: false }];
    }
    return [];
  }

  function metricHTML(stat, index) {
    const bars = chartBars(stat);
    return '<article class="metric">' +
      '<div class="metric-top"><div class="metric-value">' + esc(stat && stat.value) + '</div><span class="metric-index" aria-hidden="true">' + pad(index + 1) + '</span></div>' +
      '<div class="metric-label">' + esc(stat && stat.label) + '</div>' +
      (bars.length ? '<div class="metric-bars">' + bars.map(function (bar) {
        return '<div class="bar-row">' +
          '<span class="bar-name">' + esc(bar.label) + '</span>' +
          '<span class="bar-value">' + esc(bar.value) + '</span>' +

          '</div>';
      }).join("") + '</div>' : '') +
      '</article>';
  }

  function sampleHTML(body) {
    const openTag = "\u3010";
    const closeTag = "\u3011";
    return String(body == null ? "" : body).split("\n").map(function (line) {
      const close = line.indexOf(closeTag);
      if (line.charAt(0) === openTag && close > 0) {
        const tag = line.slice(0, close + 1);
        const rest = line.slice(close + 1);
        return '<span class="sample-text"><span class="sample-tag">' + esc(tag) + '</span>' + esc(rest) + '</span>';
      }
      return '<span class="sample-text">' + esc(line) + '</span>';
    }).join("<br>");
  }

  function blockHTML(block, section, index, sample) {
    const blockId = "block-" + txt(section.id) + "-" + index;
    const bodyId = blockId + "-body";
    const body = sample ? sampleHTML(block && block.body) : esc(block && block.body);
    return '<article class="block' + (sample ? ' sample' : '') + (section.id === "quote" ? ' quote-card' : '') + '" id="' + esc(blockId) + '">' +
      '<div class="block-label">' + esc(block && block.label) + '</div>' +
      '<h3 class="block-title">' + esc(block && block.title) + '</h3>' +
      '<div class="block-body" id="' + esc(bodyId) + '">' + body + '</div>' +

      '</article>';

    if (!section || !section.source) return "";

  }

  function inlineDeepDive(section) {
    const items = Array.isArray(section.deepDive) ? section.deepDive.filter(Boolean) : [];
    if (!items.length) return [];
    let selectors = section.inlineDeepDive;
    if (typeof selectors === "string") selectors = [selectors];
    if (!Array.isArray(selectors)) selectors = [];
    selectors = selectors.map(txt).filter(Boolean);
    if (!selectors.length && txt(section.id) === "research") selectors = ["创作者生态"];
    if (!selectors.length) return [];
    return items.filter(function (item) {
      const label = txt(item && item.label);
      return selectors.some(function (selector) { return label.indexOf(selector) !== -1; });
    });
  }

    const items = inlineDeepDive(section);
    if (!items.length) return "";
    const sectionId = txt(section.id) || "section";
    return '<div class="section-pin">' + items.map(function (item, index) {
      const bodyId = "pin-body-" + sectionId + "-" + index;
      return '<article class="pin-card">' +
        '<div class="block-label">' + esc(item && item.label) + '</div>' +

  function sectionImageHTML(section, sectionId) {

  function extraHTML(sectionId, section, pinnedItems, quoteText) {

        '<h1 class="hero-title">' + esc(home.title || data.siteTitle) + '</h1>' +

      '<div class="works-grid">' + workHTML + '</div>' +

  function renderSection(section, index) {
    const sectionId = txt(section.id) || "section-" + pad(index + 1);
    const stats = Array.isArray(section.stats) ? section.stats : [];
    const blocks = Array.isArray(section.blocks) ? section.blocks : [];
    const isSample = sectionId === "content";
    const isQuote = sectionId === "quote";
    const isResearch = sectionId === "research";
    const isMedia = sectionId === "interfaces";
    const columns = blocks.length === 2 ? " two" : "";
    const blockClass = "blocks" + (isSample ? " samples" : isQuote ? " quotes" : columns);
    const prevId = index === 0 ? "overview" : sectionEntries[index - 1].id;
    const nextId = index < sectionEntries.length - 1 ? sectionEntries[index + 1].id : (gates.length ? "gates" : "overview");
    const prevLabel = prevId === "overview" ? overviewLabel : sectionEntries[index - 1].label;
    const nextLabel = nextId === "gates" ? gateLabel : nextId === "overview" ? overviewLabel : sectionEntries[index + 1].label;
    const statsHTML = stats.length ? '<div class="data-band"><div class="band-label">' + esc(controls.evidence) + '</div><div class="metrics">' + stats.map(metricHTML).join("") + '</div></div>' : "";
    const blocksHTML = blocks.map(function (block, blockIndex) {
      return blockHTML(block, section, blockIndex, isSample);
    }).join("");
    const pinnedItems = inlineDeepDive(section);
    const inlineHTML = pinnedItems.length ? inlineDeepDiveHTML(section) : "";
    const imageHTML = sectionImageHTML(section, sectionId);
    const extra = extraHTML(sectionId, section, pinnedItems, isQuote ? quoteFull : "");

    let bodyHTML = '<div class="' + blockClass + '">' + blocksHTML + '</div>' + inlineHTML + imageHTML + extra;
    if (isResearch && (inlineHTML || imageHTML)) {
      bodyHTML = '<div class="research-layout"><div class="evidence-main"><div class="blocks evidence-blocks">' + blocksHTML + '</div>' + extra + '</div><aside class="evidence-side">' + inlineHTML + imageHTML + '</aside></div>';
    } else if (isMedia && imageHTML) {
      bodyHTML = '<div class="media-layout"><div class="media-main"><div class="blocks">' + blocksHTML + '</div>' + extra + '</div><aside class="media-side">' + imageHTML + '</aside></div>';
    }
    const footer = '<footer class="view-foot"><div class="foot-left"><button class="pill-btn" type="button" data-view="overview"><span class="arrow" aria-hidden="true">←</span>' + esc(overviewLabel) + '</button></div><div class="pager">' +
      '<button class="pill-btn" type="button" data-view="' + esc(prevId) + '" aria-label="' + esc(controls.previous + " " + prevLabel) + '"><span class="arrow" aria-hidden="true">←</span>' + esc(controls.previous) + '</button>' +
      '<button class="pill-btn" type="button" data-view="' + esc(nextId) + '" aria-label="' + esc(controls.next + " " + nextLabel) + '">' + esc(controls.next) + '<span class="arrow" aria-hidden="true">→</span></button>' +
      '</div></footer>';

    return '<section class="view' + (isResearch ? ' research-view' : '') + '" id="view-' + esc(sectionId) + '" data-view="' + esc(sectionId) + '" data-index="' + pad(index + 1) + '" tabindex="-1" hidden>' +
      '<header class="view-head"><div class="view-head-main"><div class="meta-row"><span class="kicker">' + esc(section.kicker) + '</span><span class="section-nav">' + esc(section.nav) + '</span></div>' +
      '<h2 class="display">' + esc(section.title) + '</h2><p class="summary">' + esc(section.summary) + '</p>' +
      (section.transition ? '<p class="section-transition">' + esc(section.transition) + '</p>' : '') + '</div></header>' +
      statsHTML +
      (section.stage ? '<div class="custom-stage">' + section.stage + '</div>' : '') +
      bodyHTML +
      (section.stageAfter ? '<div class="custom-stage">' + section.stageAfter + '</div>' : '') +
      sourceHTML(section) + footer +
      '</section>';
  }

  function renderGates() {
    const rows = gates.map(function (gate) {
      const stage = txt(gate && gate.stage);
      const match = stage.match(/^(\d+)\s*(.*)$/);
      return '<div class="gate-row" role="row">' +
        '<div class="gate-stage" role="cell"><span class="gate-num">' + esc(match ? match[1] : "") + '</span><span class="gate-name">' + esc(match ? match[2] : stage) + '</span></div>' +
        '<div class="gate-cell" role="cell" data-label="' + esc(controls.operation) + '"><span class="cell-label">' + esc(controls.operation) + '</span>' + esc(gate && gate.operation) + '</div>' +
        '<div class="gate-cell" role="cell" data-label="' + esc(controls.development) + '"><span class="cell-label">' + esc(controls.development) + '</span>' + esc(gate && gate.development) + '</div>' +
        '</div>';
    }).join("");
    return '<header class="view-head gate-view-head"><div class="view-head-main"><div class="meta-row"><span class="kicker">' + esc(join(controls.firstMove, controls.operation)) + '</span><span class="section-nav">' + esc(gateLabel) + '</span></div>' +
      '<h2 class="display">' + esc(gateLabel) + '</h2>' +
      '<p class="gate-intro">' + esc(join(txt(controls.firstMove), txt(home.actionPreview))) + '</p></div></header>' +
      '<div class="gate-table" role="table" aria-label="' + esc(join(gateLabel, controls.operation, controls.development)) + '">' +
      '<div class="gate-head" role="row"><div role="columnheader">' + esc(gateLabel) + '</div><div role="columnheader">' + esc(controls.operation) + '</div><div role="columnheader">' + esc(controls.development) + '</div></div>' +
      rows + '</div>' +
      '<footer class="view-foot"><div class="foot-left"><button class="pill-btn" type="button" data-view="overview"><span class="arrow" aria-hidden="true">←</span>' + esc(overviewLabel) + '</button></div><div class="pager">' +
      '<button class="pill-btn" type="button" data-view="' + esc(sectionEntries.length ? sectionEntries[sectionEntries.length - 1].id : "overview") + '" aria-label="' + esc(controls.previous) + '"><span class="arrow" aria-hidden="true">←</span>' + esc(controls.previous) + '</button>' +
      '<button class="pill-btn" type="button" data-view="overview" aria-label="' + esc(controls.next + " " + overviewLabel) + '">' + esc(controls.next) + '<span class="arrow" aria-hidden="true">→</span></button>' +
      '</div></footer>';
  }

  byId("brandTitle").textContent = txt(data.siteTitle);
  byId("brandSub").textContent = txt(data.siteSub);
  document.title = txt(data.siteTitle);
  byId("brandBtn").setAttribute("aria-label", join(data.siteTitle, overviewLabel));
  byId("topBoundaryLabel").textContent = boundaryLabel;
  byId("topBoundaryBtn").setAttribute("aria-label", boundaryLabel);
  byId("boundaryTitle").textContent = boundaryLabel;
  byId("boundaryCloseLabel").textContent = txt(controls.close);
  byId("boundaryClose").setAttribute("aria-label", join(controls.close, boundaryLabel));
  byId("boundaryBody").textContent = boundaryFull;
  byId("imageCloseLabel").textContent = txt(controls.close);
  byId("imageClose").setAttribute("aria-label", join(controls.close, controls.open));
  byId("imageOverlayCaption").hidden = true;
  byId("railLabel").textContent = navLabel;
  byId("railCountLabel").textContent = txt(controls.current);
  byId("railCount").textContent = "00 / " + pad(navEntries.length - 1);
  byId("railNav").setAttribute("aria-label", navLabel);
  byId("dockNav").setAttribute("aria-label", navLabel);
  byId("railNav").innerHTML = navButtons(false);
  byId("dockNav").innerHTML = navButtons(true);
  byId("view-overview").innerHTML = renderOverview();
  byId("sectionViews").innerHTML = sections.map(renderSection).join("");
  if (gates.length) byId("view-gates").innerHTML = renderGates();

  const overlay = byId("boundaryOverlay");
  const boundaryClose = byId("boundaryClose");
  const appRoot = byId("app");
  let lastFocus = null;
  let currentView = "overview";

  function openBoundary(trigger) {
    lastFocus = trigger || document.activeElement;
    overlay.hidden = false;
    appRoot.inert = true;
    requestAnimationFrame(function () { boundaryClose.focus(); });
  }

  function closeBoundary() {
    overlay.hidden = true;
    appRoot.inert = false;
    if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
  }

  const imageOverlay = byId("imageOverlay");
  const imageClose = byId("imageClose");
  const imageOverlayImg = byId("imageOverlayImg");
  const imageOverlayTitle = byId("imageOverlayTitle");
  const imageOverlayCaption = byId("imageOverlayCaption");
  let lastImageFocus = null;

  function openImage(trigger) {
    const img = trigger.querySelector("img");
    if (!img) return;
    const figure = trigger.closest("figure");
    const captionNode = figure ? figure.querySelector("figcaption") : null;
    const captionText = captionNode ? captionNode.textContent.trim() : "";
    lastImageFocus = trigger;
    imageOverlayImg.src = img.getAttribute("src") || "";
    imageOverlayImg.alt = img.getAttribute("alt") || captionText || txt(controls.open);
    imageOverlayTitle.textContent = captionText || imageOverlayImg.alt;
    imageOverlayCaption.textContent = captionText;
    imageOverlayCaption.hidden = !captionText;
    imageOverlay.hidden = false;
    appRoot.inert = true;
    requestAnimationFrame(function () { imageClose.focus(); });
  }

  function closeImage() {
    imageOverlay.hidden = true;
    appRoot.inert = false;
    imageOverlayImg.removeAttribute("src");
    imageOverlayImg.alt = "";
    if (lastImageFocus && document.contains(lastImageFocus) && typeof lastImageFocus.focus === "function") lastImageFocus.focus();
  }

  function trapOverlayFocus(container, event) {
    const focusables = container.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])");
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function showView(id, moveFocus) {
    const targetId = byId("view-" + id) ? id : "overview";
    currentView = targetId;
    document.querySelectorAll(".view").forEach(function (view) {
      view.hidden = view.getAttribute("data-view") !== targetId;
    });
    document.querySelectorAll(".nav-item,.dock-item").forEach(function (button) {
      if (button.getAttribute("data-view") === targetId) button.setAttribute("aria-current", "page");
      else button.removeAttribute("aria-current");
    });
    const entry = entryById[targetId] || entryById.overview;
    byId("currentLabel").textContent = txt(controls.current);
    byId("currentName").textContent = entry ? entry.label : "";
    const position = Math.max(0, order.indexOf(targetId));
    if (targetId === "gates") {
      byId("railCount").textContent = pad(navEntries.length - 1) + " / " + pad(navEntries.length - 1);
      document.documentElement.style.setProperty("--progress", "100%");
    } else {
      byId("railCount").textContent = pad(position) + " / " + pad(navEntries.length - 1);
      document.documentElement.style.setProperty("--progress", ((position + 1) / Math.max(1, order.length) * 100) + "%");
    }
    byId("scroll").scrollTop = 0;
    const active = byId("view-" + targetId);
    if (active) {
      requestAnimationFrame(function () {
        activateBars(active);
        refreshOverflow(active);
        refreshPinOverflow(active);
        if (window.__v43Enter) window.__v43Enter(active);
        if (moveFocus) {
          const heading = active.querySelector(".display,.hero-title");
          if (heading) {
            heading.setAttribute("tabindex", "-1");
            heading.focus({ preventScroll: true });
          } else {
            active.focus({ preventScroll: true });
          }
        }
      });
    }
  }

  function activateBars(root) {
    const bars = root.querySelectorAll(".bar-fill");
    bars.forEach(function (bar) { bar.style.width = "0%"; });
    requestAnimationFrame(function () {
      bars.forEach(function (bar) { bar.style.width = txt(bar.getAttribute("data-pct")) + "%"; });
    });
  }

  function refreshOverflow(root) {
    root.querySelectorAll(".block").forEach(function (block) {
      const body = block.querySelector(".block-body");
      if (!body) return;
      const wasExpanded = block.classList.contains("expanded");
      if (wasExpanded) block.classList.remove("expanded");
      const overflow = body.scrollHeight > body.clientHeight + 3;
      block.classList.toggle("has-overflow", overflow);
      if (wasExpanded) block.classList.add("expanded");
    });
  }

  function refreshPinOverflow(root) {
    root.querySelectorAll(".pin-card").forEach(function (card) {
      if (card.classList.contains("expanded")) return;
      const body = card.querySelector(".pin-body");
      const toggle = card.querySelector(".pin-toggle");
      if (!body || !toggle) return;
      if (window.matchMedia("(max-width: 860px)").matches) {
        card.classList.remove("has-overflow");
        toggle.hidden = true;
        return;
      }
      const overflow = body.scrollHeight > body.clientHeight + 3;
      card.classList.toggle("has-overflow", overflow);
      toggle.hidden = !overflow;
    });
  }

  document.addEventListener("click", function (event) {
    const viewButton = event.target.closest("button[data-view],a[data-view]");
    if (viewButton) {
      event.preventDefault();
      showView(viewButton.getAttribute("data-view"), Boolean(viewButton.closest(".view")));
      return;
    }
    const figureButton = event.target.closest(".figure-zoom");
    if (figureButton) {
      event.preventDefault();
      openImage(figureButton);
      return;
    }
    if (event.target.closest("[data-close-image]")) {
      event.preventDefault();
      closeImage();
      return;
    }
    const boundaryButton = event.target.closest("[data-open-boundary]");
    if (boundaryButton) {
      event.preventDefault();
      openBoundary(boundaryButton);
      return;
    }
    if (event.target.closest("[data-close-boundary]")) {
      event.preventDefault();
      closeBoundary();
      return;
    }
    const blockToggle = event.target.closest(".block-toggle");
    if (blockToggle) {
      const block = blockToggle.closest(".block");
      if (!block) return;
      const expanded = block.classList.toggle("expanded");
      blockToggle.setAttribute("aria-expanded", expanded ? "true" : "false");
      const label = blockToggle.querySelector(".toggle-label");
      const glyph = blockToggle.querySelector(".toggle-glyph");
      if (label) label.textContent = expanded ? txt(controls.close) : txt(controls.detail);
      if (glyph) glyph.textContent = expanded ? "−" : "+";
      return;
    }
    const pinToggle = event.target.closest(".pin-toggle");
    if (pinToggle) {
      const card = pinToggle.closest(".pin-card");
      if (!card) return;
      const expanded = card.classList.toggle("expanded");
      pinToggle.setAttribute("aria-expanded", expanded ? "true" : "false");
      const label = pinToggle.querySelector(".pin-toggle-label");
      const glyph = pinToggle.querySelector(".toggle-glyph");
      if (label) label.textContent = expanded ? txt(controls.close) : txt(controls.detail);
      if (glyph) glyph.textContent = expanded ? "−" : "+";
      return;
    }
    const extraToggle = event.target.closest(".extra-toggle");
    if (extraToggle) {
      const bodyId = extraToggle.getAttribute("aria-controls");
      const body = bodyId ? byId(bodyId) : null;
      const expanded = extraToggle.getAttribute("aria-expanded") === "true";
      extraToggle.setAttribute("aria-expanded", expanded ? "false" : "true");
      if (body) body.hidden = expanded;
      const label = extraToggle.querySelector(".extra-toggle-label");
      const glyph = extraToggle.querySelector(".toggle-glyph");
      if (label) label.textContent = expanded ? txt(controls.detail) : txt(controls.close);
      if (glyph) glyph.textContent = expanded ? "+" : "−";
      return;
    }
    const quoteToggle = event.target.closest(".quote-toggle");
    if (quoteToggle) {
      const body = byId("quoteFullBody");
      const expanded = quoteToggle.getAttribute("aria-expanded") === "true";
      quoteToggle.setAttribute("aria-expanded", expanded ? "false" : "true");
      if (body) body.hidden = expanded;
      const label = quoteToggle.querySelector(".quote-toggle-label");
      const glyph = quoteToggle.querySelector(".toggle-glyph");
      if (label) label.textContent = expanded ? txt(controls.open) : txt(controls.close);
      if (glyph) glyph.textContent = expanded ? "+" : "−";
    }
  });

  overlay.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      event.preventDefault();
      closeBoundary();
      return;
    }
    if (event.key !== "Tab") return;
    const focusables = overlay.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])");
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  imageOverlay.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      event.preventDefault();
      closeImage();
      return;
    }
    if (event.key !== "Tab") return;
    trapOverlayFocus(imageOverlay, event);
  });

  function adjacentView(step) {
    const sequence = gates.length ? order.concat(["gates"]) : order.slice();
    if (!sequence.length) return "overview";
    const current = Math.max(0, sequence.indexOf(currentView));
    return sequence[(current + step + sequence.length) % sequence.length];
  }

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      if (!imageOverlay.hidden) {
        event.preventDefault();
        closeImage();
      } else if (!overlay.hidden) {
        event.preventDefault();
        closeBoundary();
      }
      return;
    }
    if (!overlay.hidden || !imageOverlay.hidden) return;
    if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.target && event.target.closest && event.target.closest("input,textarea,select,[contenteditable='true']")) return;
    let nextId = null;
    if (event.key === "ArrowRight" || event.key === "ArrowDown" || event.key === "PageDown") nextId = adjacentView(1);
    else if (event.key === "ArrowLeft" || event.key === "ArrowUp" || event.key === "PageUp") nextId = adjacentView(-1);
    else if (event.key === "Home") nextId = "overview";
    else if (event.key === "End") nextId = gates.length ? "gates" : order[order.length - 1];
    if (!nextId) return;
    event.preventDefault();
    showView(nextId, true);
  });

  byId("app").hidden = false;
  showView("overview");
})();

  (function () {
    "use strict";

    function countUp(root) {
      root.querySelectorAll(".metric-value").forEach(function (element) {
        var raw = element.getAttribute("data-raw");
        if (raw === null) {
          raw = element.textContent.trim();
          element.setAttribute("data-raw", raw);
        }
        var percent = raw.match(/^(\d+(?:\.\d+)?)%$/);
        var fraction = raw.match(/^(\d+)(\s*\/\s*\d+)$/);
        var target;
        var suffix;
        if (percent) {
          target = parseFloat(percent[1]);
          suffix = "%";
        } else if (fraction) {
          target = parseInt(fraction[1], 10);
          suffix = fraction[2];
        } else {
          return;
        }
        if (!isFinite(target) || target > 999) return;
        var started = null;
        var duration = 760;
        function frame(now) {
          if (started === null) started = now;
          var progress = Math.min(1, (now - started) / duration);
          var eased = 1 - Math.pow(1 - progress, 3);
          var value = target * eased;
          var shown = target % 1 ? value.toFixed(1) : String(Math.round(value));
          element.textContent = shown + suffix;
          if (progress < 1) requestAnimationFrame(frame);
          else element.textContent = raw;
        }
        element.textContent = (target % 1 ? "0.0" : "0") + suffix;
        requestAnimationFrame(frame);
      });
    }

    function startFilm(root) {
      var strip = root.querySelector("[data-filmstrip]");
      if (!strip) return;
      if (window.__v43Film) {
        window.clearInterval(window.__v43Film);
        window.__v43Film = null;
      }
      var frames = Array.prototype.slice.call(strip.querySelectorAll(".frame"));
      if (!frames.length) return;
      var bar = strip.querySelector(".film-progress i");
      var index = 0;
      var dots = strip.querySelector(".film-dots");
      if (!dots) {
        dots = document.createElement("div");
        dots.className = "film-dots";
        frames.forEach(function (_, position) {
          var button = document.createElement("button");
          button.type = "button";
          button.setAttribute("aria-label", "分镜 " + (position + 1));
          button.addEventListener("click", function () {
            show(position);
          });
          dots.appendChild(button);
        });
        strip.appendChild(dots);
      }
      var buttons = Array.prototype.slice.call(dots.querySelectorAll("button"));

      function show(position) {
        index = position;
        frames.forEach(function (frame, order) {
          frame.classList.toggle("is-active", order === position);
        });
        buttons.forEach(function (button, order) {
          button.classList.toggle("is-on", order === position);
        });
        if (bar) {
          bar.style.animation = "none";
          void bar.offsetWidth;
          bar.style.animation = "";
        }
      }

      show(0);
      window.__v43Film = window.setInterval(function () {
        show((index + 1) % frames.length);
      }, 3800);
    }

    function playEnter(root) {
      if (!root) return;
      root.classList.remove("is-in");
      var selector = [
        ".hero-title", ".hero-intro", ".signal", ".orientation",
        ".metric", ".block", ".home-card", ".work-card",
        ".deep-dive-item", ".gate-row", ".day-node", ".qs-row",
        ".spec-card", ".ask-strip", ".title-option", ".xhs-card", ".v43-story", ".v43-script"
      ].join(",");
      var items = root.querySelectorAll(selector);
      items.forEach(function (element, position) {
        element.style.setProperty("--i", Math.min(position, 6));
        element.classList.add("reveal");
      });
      void root.offsetWidth;
      root.classList.add("is-in");
      countUp(root);
      startFilm(root);
    }

    window.__v43Enter = playEnter;
    requestAnimationFrame(function () {
      playEnter(document.querySelector(".view:not([hidden])"));
    });
  })();

</script>
